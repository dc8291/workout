<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Workout Log</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #000;
    --bg2: #1c1c1e;
    --bg3: #2c2c2e;
    --bg4: #3a3a3c;
    --accent: #ff375f;
    --accent2: #ff6b35;
    --green: #30d158;
    --blue: #0a84ff;
    --yellow: #ffd60a;
    --purple: #bf5af2;
    --teal: #64d2ff;
    --orange: #ff9f0a;
    --text: #fff;
    --text2: #ebebf5cc;
    --text3: #ebebf560;
    --radius: 16px;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; min-height: 100vh; overflow-x: hidden; }

  .screen { display: none; min-height: 100vh; padding-bottom: 90px; }
  .screen.active { display: block; }

  .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28,28,30,0.95); backdrop-filter: blur(20px); border-top: 1px solid #ffffff18; display: flex; justify-content: space-around; align-items: flex-end; padding: 8px 0 24px; z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 16px; opacity: 0.5; transition: opacity 0.2s; }
  .nav-item.active { opacity: 1; }
  .nav-icon { font-size: 22px; }
  .nav-label { font-size: 10px; letter-spacing: 0.3px; }

  .header { padding: 56px 20px 16px; }
  .header h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  .header p { color: var(--text3); font-size: 14px; margin-top: 4px; }

  .day-selector { display: flex; gap: 8px; padding: 0 20px 16px; overflow-x: auto; scrollbar-width: none; }
  .day-selector::-webkit-scrollbar { display: none; }
  .day-btn { flex-shrink: 0; padding: 8px 16px; border-radius: 20px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .day-btn.inactive { background: var(--bg3); color: var(--text2); }
  .day-btn.active { background: var(--accent); color: #fff; }

  .section-header { padding: 8px 20px 8px; font-size: 13px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; display: flex; justify-content: space-between; align-items: center; }
  .section-header .add-btn { background: var(--bg3); color: var(--text); border: none; border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: 0.3px; }

  .exercise-card { background: var(--bg2); margin: 0 16px 10px; border-radius: var(--radius); overflow: hidden; }
  .exercise-header { display: flex; align-items: center; padding: 14px 16px; gap: 12px; }
  .exercise-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--bg4); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; font-size: 13px; cursor: pointer; }
  .exercise-check.done { background: var(--green); border-color: var(--green); }
  .exercise-info { flex: 1; cursor: pointer; min-width: 0; }
  .exercise-name { font-size: 16px; font-weight: 600; }
  .exercise-meta { font-size: 13px; color: var(--text3); margin-top: 2px; }
  .exercise-last { font-size: 12px; color: var(--blue); margin-top: 2px; }
  .chevron { color: var(--text3); font-size: 12px; transition: transform 0.2s; cursor: pointer; padding: 4px 8px; }
  .exercise-body { padding: 0 16px 16px; display: none; }
  .exercise-body.open { display: block; }

  .sets-grid { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  .sets-grid.header-row { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .set-label { font-size: 14px; color: var(--text3); font-weight: 500; }
  .set-input { background: var(--bg3); border: none; border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 15px; font-weight: 600; width: 100%; text-align: center; outline: none; transition: background 0.2s; }
  .set-input:focus { background: var(--bg4); }
  .notes-input { background: var(--bg3); border: none; border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14px; width: 100%; outline: none; margin-top: 8px; }
  .save-set-btn { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 12px; transition: opacity 0.2s; }
  .save-set-btn:active { opacity: 0.7; }

  .row-btns { display: flex; gap: 8px; margin-top: 10px; }
  .row-btn { flex: 1; background: var(--bg3); color: var(--text2); border: none; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .row-btn.danger { color: var(--accent); }

  .mobility-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg2); margin: 0 16px 6px; border-radius: 12px; cursor: pointer; }
  .mob-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bg4); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all 0.2s; }
  .mob-check.done { background: var(--yellow); border-color: var(--yellow); }
  .mob-text { font-size: 14px; color: var(--text2); }

  .progress-list { padding: 0 16px; }
  .progress-card { background: var(--bg2); border-radius: var(--radius); margin-bottom: 12px; padding: 16px; }
  .progress-exercise { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .progress-day-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-bottom: 10px; background: var(--bg3); color: var(--text2); }
  .progress-entries { font-size: 13px; color: var(--text3); }
  .progress-entry { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #ffffff0a; }
  .progress-entry:last-child { border-bottom: none; }
  .entry-date { color: var(--text3); }
  .entry-stats { color: var(--text2); font-weight: 500; }
  .pr-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; margin-left: 6px; }

  .bests-section { padding: 0 16px; }
  .bests-day-header { font-size: 20px; font-weight: 700; margin: 20px 0 10px; }
  .best-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg2); padding: 12px 14px; border-radius: 12px; margin-bottom: 6px; }
  .best-name { font-size: 14px; color: var(--text2); }
  .best-val { font-size: 14px; font-weight: 600; }

  .complete-banner { background: linear-gradient(135deg, #30d158, #0a84ff); margin: 16px; border-radius: var(--radius); padding: 18px; text-align: center; display: none; }
  .complete-banner.show { display: block; }
  .complete-banner h2 { font-size: 22px; font-weight: 700; }
  .complete-banner p { font-size: 14px; opacity: 0.85; margin-top: 4px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border-radius: 24px 24px 0 0; padding: 20px 20px 40px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
  .field-label { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin: 12px 0 6px; }
  .field-input { background: var(--bg3); border: none; border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px; width: 100%; outline: none; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-primary { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-secondary { flex: 1; background: var(--bg3); color: var(--text); border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; }

  /* TOAST */
  .toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--green); color: #fff; padding: 12px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; z-index: 300; opacity: 0; transition: all 0.3s ease; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .pop { animation: pop 0.25s ease; }

  ::-webkit-scrollbar { width: 0; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 15px; }
</style>
</head>
<body>

<!-- TODAY SCREEN -->
<div class="screen active" id="screen-today">
  <div class="header">
    <h1>💪 Today</h1>
    <p id="today-date"></p>
  </div>
  <div class="day-selector" id="day-selector"></div>
  <div id="workout-content"></div>
</div>

<!-- PROGRESS SCREEN -->
<div class="screen" id="screen-progress">
  <div class="header">
    <h1>📈 Progress</h1>
    <p>Your logged history</p>
  </div>
  <div class="progress-list" id="progress-list"></div>
</div>

<!-- BESTS SCREEN -->
<div class="screen" id="screen-bests">
  <div class="header">
    <h1>🏆 Recent Bests</h1>
    <p>Last logged weight per exercise</p>
  </div>
  <div class="bests-section" id="bests-section"></div>
</div>

<!-- NAV -->
<div class="nav-bar">
  <div class="nav-item active" onclick="showScreen('today', this)">
    <div class="nav-icon">🏋️</div><div class="nav-label">Today</div>
  </div>
  <div class="nav-item" onclick="showScreen('progress', this)">
    <div class="nav-icon">📈</div><div class="nav-label">Progress</div>
  </div>
  <div class="nav-item" onclick="showScreen('bests', this)">
    <div class="nav-icon">🏆</div><div class="nav-label">Bests</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">Edit Exercise</div>
    <div class="field-label">Name</div>
    <input class="field-input" id="modal-name" placeholder="e.g. DB Bench Press">
    <div class="field-label">Sets</div>
    <input class="field-input" id="modal-sets" type="number" inputmode="numeric" placeholder="3">
    <div class="field-label">Reps</div>
    <input class="field-input" id="modal-reps" placeholder="e.g. 8-12">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="modal-save">Save</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">Saved ✓</div>

<script>
// ============================================================
// DEFAULT WORKOUTS (3 main exercises per day)
// ============================================================
const DEFAULT_WORKOUTS = {
  mon: {
    label: 'MON', title: 'Monday — Upper Body Push', color: '#ff375f',
    exercises: [
      { name: 'DB Bench Press', sets: 4, reps: '8-12' },
      { name: 'DB Shoulder Press', sets: 3, reps: '10-12' },
      { name: 'DB Skull Crushers', sets: 3, reps: '10-12' },
    ],
    mobility: [
      'Chest Doorway Stretch (2 x 30 sec each side)',
      'Shoulder Cross-Body Stretch (2 x 30 sec each side)',
      'Thoracic Spine Rotation (2 x 10 reps each side)',
    ]
  },
  tue: {
    label: 'TUE', title: 'Tuesday — Lower Body & Core', color: '#0a84ff',
    exercises: [
      { name: 'DB Goblet Squat', sets: 4, reps: '10-12' },
      { name: 'DB Romanian Deadlift', sets: 4, reps: '10-12' },
      { name: 'Plank', sets: 3, reps: '45-60 sec' },
    ],
    mobility: [
      'Hip Flexor Lunge Stretch (2 x 45 sec each side)',
      'Pigeon Pose (2 x 45 sec each side)',
      'Hamstring Floor Stretch (2 x 30 sec each side)',
    ]
  },
  wed: {
    label: 'WED', title: 'Wednesday — Active Recovery', color: '#bf5af2',
    exercises: [
      { name: 'Bodyweight Squat', sets: 2, reps: '15' },
      { name: 'Glute Bridge', sets: 2, reps: '15' },
      { name: 'Bird Dog', sets: 2, reps: '10/side' },
    ],
    mobility: [
      'Cat-Cow (2 x 10 reps)',
      'Child\'s Pose (2 x 45 sec)',
      'Standing Forward Fold (2 x 30 sec)',
    ]
  },
  thu: {
    label: 'THU', title: 'Thursday — Upper Body Pull', color: '#30d158',
    note: '⚡ Light day — stop before failure!',
    exercises: [
      { name: 'DB Bent-Over Row', sets: 3, reps: '10-12' },
      { name: 'DB Single-Arm Row', sets: 3, reps: '10-12/side' },
      { name: 'DB Hammer Curl', sets: 3, reps: '10-12' },
    ],
    mobility: [
      'Cat-Cow (2 x 10 reps)',
      "World's Greatest Stretch (2 x 5 per side)",
      'Lat Stretch on Bench (2 x 30 sec each side)',
    ]
  },
  fri: {
    label: 'FRI', title: 'Friday — Full Body Power', color: '#ffd60a',
    exercises: [
      { name: 'DB Deadlift', sets: 4, reps: '8-10' },
      { name: 'DB Arnold Press', sets: 3, reps: '8-10' },
      { name: "DB Farmer's Carry", sets: 3, reps: '30-40 steps' },
    ],
    mobility: [
      'Full Body Foam Roll (5-10 min)',
      'Figure-4 Glute Stretch (2 x 45 sec each side)',
      'Overhead Tricep and Lat Stretch (2 x 30 sec each side)',
    ]
  },
  sat: {
    label: 'SAT', title: 'Saturday — Mobility & Core', color: '#64d2ff',
    exercises: [
      { name: 'Dead Bug', sets: 3, reps: '10/side' },
      { name: 'Side Plank', sets: 2, reps: '30 sec/side' },
      { name: 'Hollow Hold', sets: 3, reps: '20 sec' },
    ],
    mobility: [
      'Foam Roll Back & Hips (5 min)',
      'Deep Squat Hold (2 x 45 sec)',
      'Thread the Needle (2 x 30 sec/side)',
    ]
  },
  sun: {
    label: 'SUN', title: 'Sunday — Light Recovery', color: '#ff9f0a',
    exercises: [
      { name: 'Walking (moderate pace)', sets: 1, reps: '20-30 min' },
      { name: 'Push-Up (easy pace)', sets: 2, reps: '10' },
      { name: 'Bodyweight Row / Doorway Row', sets: 2, reps: '10' },
    ],
    mobility: [
      'Full Body Stretch Routine (10 min)',
      'Diaphragmatic Breathing (5 min)',
      'Neck & Shoulder Rolls (2 x 10)',
    ]
  },
};

// ============================================================
// STORAGE
// ============================================================
let memStore = {};
function lsGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : (fallback ?? null);
  } catch(e) { return (memStore[key] !== undefined ? memStore[key] : (fallback ?? null)); }
}
function lsSet(key, val) {
  memStore[key] = val;
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

// Load or seed workouts (editable & persisted)
function loadWorkouts() {
  const saved = lsGet('workoutsV2', null);
  if (saved) {
    // Ensure any missing days fall back to defaults (safety on schema changes)
    Object.keys(DEFAULT_WORKOUTS).forEach(k => {
      if (!saved[k]) saved[k] = JSON.parse(JSON.stringify(DEFAULT_WORKOUTS[k]));
    });
    return saved;
  }
  const fresh = JSON.parse(JSON.stringify(DEFAULT_WORKOUTS));
  lsSet('workoutsV2', fresh);
  return fresh;
}
let WORKOUTS = loadWorkouts();
function saveWorkouts() { lsSet('workoutsV2', WORKOUTS); }

function getLog()    { return lsGet('workoutLog', {}) || {}; }
function saveLog(l)  { lsSet('workoutLog', l); }
function getChecks() { return lsGet('exerciseChecksV2', {}) || {}; }
function saveChecks(c){ lsSet('exerciseChecksV2', c); }
function getMob()    { return lsGet('mobChecksV2', {}) || {}; }
function saveMob(c)  { lsSet('mobChecksV2', c); }

// ============================================================
// WEEKLY AUTO-RESET
// Checks are stamped with the ISO date they were set on.
// When rendering, if the stamped date is >= 7 days ago OR is a
// different weekday than today, we clear that day's checks.
// Simpler rule: each day's checks store the last date logged;
// if today !== that date AND today's weekday === that day's key,
// we reset (i.e. it's a new occurrence of that weekday).
// ============================================================
const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysBetween(iso1, iso2) {
  const a = new Date(iso1 + 'T00:00:00');
  const b = new Date(iso2 + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function maybeResetDay(dayKey) {
  const checks = getChecks();
  const rec = checks[dayKey];
  if (!rec || !rec.stamp) return;
  // If 7+ days passed since last stamp -> reset. Also reset if it's a new day and this dayKey matches today's weekday.
  const today = todayISO();
  const diff = daysBetween(rec.stamp, today);
  const todayKey = DAY_KEYS[new Date().getDay()];
  if (diff >= 7 || (diff >= 1 && dayKey === todayKey)) {
    checks[dayKey] = { stamp: today, done: {} };
    saveChecks(checks);
    // also reset mobility for that day
    const mob = getMob();
    mob[dayKey] = { stamp: today, done: {} };
    saveMob(mob);
  }
}
function resetAllStaleDays() {
  Object.keys(WORKOUTS).forEach(maybeResetDay);
}

// ============================================================
// STATE
// ============================================================
const todayIdx = new Date().getDay();
let activeDay = DAY_KEYS[todayIdx];

// ============================================================
// TOAST
// ============================================================
let toastTimer = null;
function toast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color || 'var(--green)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ============================================================
// SCREEN NAV
// ============================================================
function showScreen(name, el) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'progress') renderProgress();
  if (name === 'bests') renderBests();
}

// ============================================================
// DATE HEADER
// ============================================================
document.getElementById('today-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

// ============================================================
// DAY SELECTOR
// ============================================================
function renderDaySelector() {
  const sel = document.getElementById('day-selector');
  sel.innerHTML = '';
  ['mon','tue','wed','thu','fri','sat','sun'].forEach(key => {
    const w = WORKOUTS[key];
    const btn = document.createElement('button');
    btn.className = 'day-btn ' + (key === activeDay ? 'active' : 'inactive');
    if (key === activeDay) btn.style.background = w.color;
    btn.textContent = w.label;
    btn.onclick = () => { activeDay = key; renderDaySelector(); renderWorkout(); };
    sel.appendChild(btn);
  });
}

// ============================================================
// WORKOUT RENDERER
// ============================================================
function renderWorkout() {
  resetAllStaleDays();
  const container = document.getElementById('workout-content');
  const w = WORKOUTS[activeDay];
  container.innerHTML = '';

  // Title
  const title = document.createElement('div');
  title.className = 'section-header';
  title.style.fontSize = '17px';
  title.style.color = w.color;
  title.style.textTransform = 'none';
  title.style.letterSpacing = '-0.2px';
  title.innerHTML = `<span>${w.title}</span>`;
  container.appendChild(title);

  if (w.note) {
    const note = document.createElement('div');
    note.style.cssText = `margin: 0 16px 10px; background: ${w.color}22; color: ${w.color}; padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 600;`;
    note.textContent = w.note;
    container.appendChild(note);
  }

  // Exercises header + add button
  const exH = document.createElement('div');
  exH.className = 'section-header';
  exH.innerHTML = `<span>Exercises</span><button class="add-btn" onclick="openAddExercise()">+ Add</button>`;
  container.appendChild(exH);

  const checks = getChecks();
  const dayChecks = (checks[activeDay] && checks[activeDay].done) || {};
  const log = getLog();

  w.exercises.forEach((ex, i) => {
    const ck = dayChecks[i] || false;
    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.id = `ex-card-${i}`;

    const logKey = `${activeDay}__${ex.name}`;
    const entries = log[logKey] || [];
    const lastEntry = entries.length ? entries[entries.length - 1] : null;
    const lastText = lastEntry
      ? `Last: ${lastEntry.date} · ${lastEntry.s1w}lb × ${lastEntry.s1r}`
      : 'No logs yet';

    card.innerHTML = `
      <div class="exercise-header">
        <div class="exercise-check ${ck ? 'done' : ''}" id="ck-${i}" onclick="toggleCheck(${i})">${ck ? '✓' : ''}</div>
        <div class="exercise-info" onclick="toggleExercise(${i})">
          <div class="exercise-name">${escapeHtml(ex.name)}</div>
          <div class="exercise-meta">${ex.sets} sets · ${escapeHtml(ex.reps)} reps</div>
          <div class="exercise-last">${escapeHtml(lastText)}</div>
        </div>
        <div class="chevron" id="chev-${i}" onclick="toggleExercise(${i})">›</div>
      </div>
      <div class="exercise-body" id="ex-body-${i}">
        <div class="sets-grid header-row">
          <div></div><div>Weight (lbs)</div><div>Reps</div>
        </div>
        ${buildSetRows(ex.sets, i, lastEntry)}
        <input class="notes-input" id="notes-${i}" placeholder="Notes (optional)" value="${lastEntry ? escapeAttr(lastEntry.notes || '') : ''}">
        <button class="save-set-btn" onclick="saveExercise(${i})" style="background:${w.color}">Save & Mark Done ✓</button>
        <div class="row-btns">
          <button class="row-btn" onclick="openEditExercise(${i})">✎ Edit</button>
          <button class="row-btn danger" onclick="removeExercise(${i})">🗑 Remove</button>
        </div>
      </div>`;
    container.appendChild(card);
  });

  if (!w.exercises.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = 'No exercises yet.<br>Tap <b>+ Add</b> to create one.';
    container.appendChild(empty);
  }

  // Mobility
  const mobH = document.createElement('div');
  mobH.className = 'section-header';
  mobH.style.marginTop = '16px';
  mobH.innerHTML = `<span>🧘 Mobility Finisher</span>`;
  container.appendChild(mobH);

  const mobStore = getMob();
  const mobDone = (mobStore[activeDay] && mobStore[activeDay].done) || {};
  w.mobility.forEach((m, i) => {
    const mck = mobDone[i] || false;
    const item = document.createElement('div');
    item.className = 'mobility-item';
    item.onclick = () => toggleMob(i);
    item.innerHTML = `
      <div class="mob-check ${mck ? 'done' : ''}" id="mob-${i}">${mck ? '✓' : ''}</div>
      <div class="mob-text">${escapeHtml(m)}</div>`;
    container.appendChild(item);
  });

  // Completion banner
  const banner = document.createElement('div');
  banner.className = 'complete-banner' + (isComplete() ? ' show' : '');
  banner.id = 'complete-banner';
  banner.innerHTML = `<h2>🎉 Workout Complete!</h2><p>Amazing work — keep logging those PRs!</p>`;
  container.appendChild(banner);

  const sp = document.createElement('div');
  sp.style.height = '20px';
  container.appendChild(sp);
}

function buildSetRows(numSets, exIdx, lastEntry) {
  let html = '';
  for (let s = 1; s <= numSets; s++) {
    const lastW = lastEntry ? (lastEntry[`s${s}w`] || '') : '';
    const lastR = lastEntry ? (lastEntry[`s${s}r`] || '') : '';
    html += `<div class="sets-grid">
      <div class="set-label">S${s}</div>
      <input class="set-input" type="number" id="w${s}-${exIdx}" placeholder="${lastW || '0'}" inputmode="decimal">
      <input class="set-input" type="number" id="r${s}-${exIdx}" placeholder="${lastR || '0'}" inputmode="numeric">
    </div>`;
  }
  return html;
}

function toggleExercise(i) {
  const body = document.getElementById(`ex-body-${i}`);
  const chev = document.getElementById(`chev-${i}`);
  if (!body) return;
  const isOpen = body.classList.contains('open');
  document.querySelectorAll('.exercise-body').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.chevron').forEach(c => { c.style.transform = ''; });
  if (!isOpen) {
    body.classList.add('open');
    if (chev) chev.style.transform = 'rotate(90deg)';
  }
}

// Togglable check (independent of save)
function toggleCheck(idx) {
  const checks = getChecks();
  if (!checks[activeDay]) checks[activeDay] = { stamp: todayISO(), done: {} };
  checks[activeDay].stamp = todayISO();
  const cur = checks[activeDay].done[idx] || false;
  checks[activeDay].done[idx] = !cur;
  saveChecks(checks);

  const el = document.getElementById(`ck-${idx}`);
  if (checks[activeDay].done[idx]) {
    el.textContent = '✓';
    el.classList.add('done', 'pop');
    setTimeout(() => el.classList.remove('pop'), 300);
  } else {
    el.textContent = '';
    el.classList.remove('done');
  }
  checkCompletion();
}

function saveExercise(idx) {
  const w = WORKOUTS[activeDay];
  const ex = w.exercises[idx];
  const today = new Date().toLocaleDateString('en-US', { month:'numeric', day:'numeric', year:'2-digit' });
  const notes = document.getElementById(`notes-${idx}`).value;
  const entry = { date: today, notes };
  for (let s = 1; s <= ex.sets; s++) {
    const wEl = document.getElementById(`w${s}-${idx}`);
    const rEl = document.getElementById(`r${s}-${idx}`);
    entry[`s${s}w`] = wEl.value || wEl.placeholder;
    entry[`s${s}r`] = rEl.value || rEl.placeholder;
  }
  const log = getLog();
  const logKey = `${activeDay}__${ex.name}`;
  if (!log[logKey]) log[logKey] = [];
  log[logKey].push(entry);
  saveLog(log);

  // Mark done + stamp today
  const checks = getChecks();
  if (!checks[activeDay]) checks[activeDay] = { stamp: todayISO(), done: {} };
  checks[activeDay].stamp = todayISO();
  checks[activeDay].done[idx] = true;
  saveChecks(checks);

  const ckEl = document.getElementById(`ck-${idx}`);
  ckEl.textContent = '✓';
  ckEl.classList.add('done', 'pop');
  setTimeout(() => ckEl.classList.remove('pop'), 300);

  toast(`${ex.name} saved ✓`);
  toggleExercise(-1);
  // Re-render to update "Last:" text
  renderWorkout();
  checkCompletion();
}

function toggleMob(i) {
  const mob = getMob();
  if (!mob[activeDay]) mob[activeDay] = { stamp: todayISO(), done: {} };
  mob[activeDay].stamp = todayISO();
  mob[activeDay].done[i] = !(mob[activeDay].done[i]);
  saveMob(mob);
  const el = document.getElementById(`mob-${i}`);
  if (mob[activeDay].done[i]) { el.textContent = '✓'; el.classList.add('done'); }
  else { el.textContent = ''; el.classList.remove('done'); }
  checkCompletion();
}

function isComplete() {
  const w = WORKOUTS[activeDay];
  if (!w || !w.exercises.length) return false;
  const checks = getChecks();
  const dc = (checks[activeDay] && checks[activeDay].done) || {};
  return w.exercises.every((_, i) => dc[i]);
}
function checkCompletion() {
  const banner = document.getElementById('complete-banner');
  if (!banner) return;
  if (isComplete()) banner.classList.add('show');
  else banner.classList.remove('show');
}

// ============================================================
// EDIT / ADD / REMOVE
// ============================================================
let modalMode = null; // 'add' | 'edit'
let modalEditIdx = null;

function openAddExercise() {
  modalMode = 'add';
  modalEditIdx = null;
  document.getElementById('modal-title').textContent = 'Add Exercise';
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-sets').value = 3;
  document.getElementById('modal-reps').value = '8-12';
  document.getElementById('modal-overlay').classList.add('open');
}
function openEditExercise(idx) {
  modalMode = 'edit';
  modalEditIdx = idx;
  const ex = WORKOUTS[activeDay].exercises[idx];
  document.getElementById('modal-title').textContent = 'Edit Exercise';
  document.getElementById('modal-name').value = ex.name;
  document.getElementById('modal-sets').value = ex.sets;
  document.getElementById('modal-reps').value = ex.reps;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-save').onclick = () => {
  const name = document.getElementById('modal-name').value.trim();
  const sets = Math.max(1, parseInt(document.getElementById('modal-sets').value) || 1);
  const reps = document.getElementById('modal-reps').value.trim() || '8-12';
  if (!name) { toast('Name required', 'var(--accent)'); return; }

  if (modalMode === 'add') {
    WORKOUTS[activeDay].exercises.push({ name, sets, reps });
    toast('Exercise added ✓');
  } else if (modalMode === 'edit' && modalEditIdx !== null) {
    const oldName = WORKOUTS[activeDay].exercises[modalEditIdx].name;
    WORKOUTS[activeDay].exercises[modalEditIdx] = { name, sets, reps };
    // Migrate log key if name changed
    if (oldName !== name) {
      const log = getLog();
      const oldKey = `${activeDay}__${oldName}`;
      const newKey = `${activeDay}__${name}`;
      if (log[oldKey]) {
        log[newKey] = (log[newKey] || []).concat(log[oldKey]);
        delete log[oldKey];
        saveLog(log);
      }
    }
    toast('Exercise updated ✓');
  }
  saveWorkouts();
  closeModal();
  renderWorkout();
};

function removeExercise(idx) {
  const ex = WORKOUTS[activeDay].exercises[idx];
  if (!confirm(`Remove "${ex.name}"?`)) return;
  WORKOUTS[activeDay].exercises.splice(idx, 1);
  // Shift check indexes
  const checks = getChecks();
  if (checks[activeDay] && checks[activeDay].done) {
    const done = checks[activeDay].done;
    const newDone = {};
    Object.keys(done).map(Number).sort((a,b)=>a-b).forEach(k => {
      if (k < idx) newDone[k] = done[k];
      else if (k > idx) newDone[k-1] = done[k];
    });
    checks[activeDay].done = newDone;
    saveChecks(checks);
  }
  saveWorkouts();
  toast('Removed');
  renderWorkout();
}

// ============================================================
// PROGRESS
// ============================================================
function renderProgress() {
  const container = document.getElementById('progress-list');
  container.innerHTML = '';
  const log = getLog();
  const dayOrder = ['mon','tue','wed','thu','fri','sat','sun'];

  let hasAny = false;
  dayOrder.forEach(day => {
    const w = WORKOUTS[day];
    // Show any logged exercise, even if it no longer exists on the day
    const dayKeys = Object.keys(log).filter(k => k.startsWith(day + '__'));
    dayKeys.forEach(logKey => {
      const entries = log[logKey] || [];
      if (!entries.length) return;
      hasAny = true;
      const exName = logKey.slice(day.length + 2);
      const card = document.createElement('div');
      card.className = 'progress-card';
      let maxW = 0;
      let entriesHtml = entries.map((e, ei) => {
        const w1 = parseFloat(e.s1w) || 0;
        const isPR = w1 > maxW && ei > 0;
        if (w1 > maxW) maxW = w1;
        return `<div class="progress-entry">
          <span class="entry-date">${escapeHtml(e.date)}</span>
          <span class="entry-stats">${escapeHtml(String(e.s1w))}lb × ${escapeHtml(String(e.s1r))}${isPR ? ' <span class="pr-badge">PR</span>' : ''}</span>
        </div>`;
      }).join('');
      const tag = document.createElement('span');
      card.innerHTML = `
        <div class="progress-exercise">${escapeHtml(exName)}</div>
        <span class="progress-day-tag" style="background:${w.color}22;color:${w.color}">${w.label}</span>
        <div class="progress-entries">${entriesHtml}</div>`;
      container.appendChild(card);
    });
  });

  if (!hasAny) {
    container.innerHTML = '<div class="empty">No workouts logged yet.<br>Start logging to see your progress! 💪</div>';
  }
}

// ============================================================
// BESTS
// ============================================================
function renderBests() {
  const container = document.getElementById('bests-section');
  container.innerHTML = '';
  const log = getLog();
  const dayOrder = ['mon','tue','wed','thu','fri','sat','sun'];

  dayOrder.forEach(day => {
    const w = WORKOUTS[day];
    if (!w.exercises.length) return;
    const header = document.createElement('div');
    header.className = 'bests-day-header';
    header.style.color = w.color;
    header.textContent = w.title;
    container.appendChild(header);

    w.exercises.forEach(ex => {
      const entries = log[`${day}__${ex.name}`] || [];
      let displayDate = '—', displayVal = '—';
      if (entries.length) {
        const last = entries[entries.length - 1];
        displayDate = last.date;
        displayVal = `${last.s1w} lbs × ${last.s1r}`;
      }
      const row = document.createElement('div');
      row.className = 'best-row';
      row.innerHTML = `
        <div>
          <div class="best-name">${escapeHtml(ex.name)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px;">${escapeHtml(displayDate)}</div>
        </div>
        <div class="best-val">${escapeHtml(displayVal)}</div>`;
      container.appendChild(row);
    });
  });
}

// ============================================================
// UTILS
// ============================================================
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

// ============================================================
// INIT
// ============================================================
resetAllStaleDays();
renderDaySelector();
renderWorkout();
</script>
